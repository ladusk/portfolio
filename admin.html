<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Mensagens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<h2>Painel Administrativo (oculto)</h2>
<p><a href="index.html">← Voltar ao site</a></p>

<table class="table table-striped table-bordered mt-3">
  <thead class="table-dark">
    <tr>
      <th>Nome</th><th>E-mail</th><th>Mensagem</th><th>Ações</th>
    </tr>
  </thead>
  <tbody id="admin-tbody"></tbody>
</table>

<script>
// O mesmo nome de chave usado no app.js
const STORAGE_KEY = 'canes_contact_messages';

function getMessages() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
function saveMessages(a) { localStorage.setItem(STORAGE_KEY, JSON.stringify(a)); }

function render() {
  const tbody = document.getElementById('admin-tbody');
  tbody.innerHTML = '';
  getMessages().forEach(m => {
    tbody.innerHTML += `
      <tr>
        <td>${m.name}</td>
        <td>${m.email}</td>
        <td>${m.message}</td>
        <td>
          <button class="btn btn-sm btn-warning" onclick="editMessage(${m.id})">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="delMessage(${m.id})">Excluir</button>
        </td>
      </tr>`;
  });
}
function editMessage(id) {
  const all = getMessages();
  const m = all.find(x => x.id === id);
  const novo = prompt('Novo texto:', m.message);
  if (novo !== null && novo.trim() !== '') {
    m.message = novo.trim();
    saveMessages(all);
    render();
  }
}
function delMessage(id) {
  if (!confirm('Excluir?')) return;
  saveMessages(getMessages().filter(m => m.id !== id));
  render();
}
// Roda a função assim que a página carrega
render();
</script>
</body>
</html>
